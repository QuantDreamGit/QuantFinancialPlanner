[server]
# Choose loopback, lan, tailscale, or netbird. On the VM, select its connected VPN.
mode = loopback
port = 8080

# Paths are relative to this file. Use absolute paths for storage outside the project.
database = data/finance.sqlite3

# Set false on a VM with a prebuilt projection binary or for a Python-only deployment.
build = true
projection_bin = build/planner_projection

# Optional for loopback mode with an HTTPS reverse proxy, such as Tailscale Serve.
# public_url = https://quant.example.ts.net

[backups]
enabled = true
directory = backups
interval_hours = 24
keep = 14
